name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version-file: .github/workflows/.java-version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Madani Debug APK
        run: ./gradlew assembleMadaniDebug

      - name: Prepare APK Files
        run: |
          mkdir -p release_apks
          cp app/build/outputs/apk/madani/debug/app-madani-debug.apk release_apks/quran-android-v3.6.5-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-android-v3.6.5-apk
          path: release_apks/quran-android-v3.6.5-debug.apk
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v3.6.5"
          gh release create "$TAG_NAME" release_apks/quran-android-v3.6.5-debug.apk \
            --title "Quran Android v3.6.5" \
            --notes "Quran Android v3.6.5 sürümü. Otomatik derlenen güncel APK aşağıda yer almaktadır." \
            || gh release upload "$TAG_NAME" release_apks/quran-android-v3.6.5-debug.apk --clobber
